[project]
name = "ci-hunter"
version = "0.1.0"
description = "CI/Test slowdown detection agent"
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.20.0,<2",
  "httpx>=0.28.1,<0.29",
  "psycopg[binary]>=3.3.6,<4",
  "pyjwt[crypto]>=2.15.1,<3",
  "pyyaml>=6.0.3,<7",
  "sqlalchemy>=2.1.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.1.1,<10",
  "respx>=0.23.1,<0.24",
  "setuptools>=84.0.0,<85",
  "wheel>=0.48.0,<0.49",
]

[project.scripts]
ci-hunter = "ci_hunter.cli:main"
ci-hunter-webhook = "ci_hunter.webhook_cmd:main"
ci-hunter-webhook-listener = "ci_hunter.webhook_listener_cmd:main"
ci-hunter-scheduler = "ci_hunter.scheduler_cmd:main"
ci-hunter-worker = "ci_hunter.worker_cmd:main"

[build-system]
requires = ["setuptools>=84.0.0,<85", "wheel>=0.48.0,<0.49"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: tests that require external services or environment setup",
]
