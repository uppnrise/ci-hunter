name: postgres-integration

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ci_hunter_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ci_hunter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI_HUNTER_POSTGRES_TEST_URL: postgresql://postgres:postgres@127.0.0.1:5433/ci_hunter_test

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --require-hashes -r requirements-dev.txt
          python -m pip install --no-deps --no-build-isolation -e .

      - name: Run migration smoke test
        run: |
          CI_HUNTER_ALEMBIC_URL="$CI_HUNTER_POSTGRES_TEST_URL" alembic upgrade head

      - name: Run Postgres integration tests
        run: |
          pytest -q tests/integration/test_postgres_integration.py
